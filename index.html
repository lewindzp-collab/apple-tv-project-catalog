<!doctype html>
<!--
THESIS: A cinematic Apple-TV-session style interface: a calm fixed sidebar, one dominant artwork
canvas, and a close-set content rail along the bottom.
OWN-WORLD: Deep navy glass, luminous photographic art, crisp white type, compact profile and
navigation controls, and neutral 16:9 posters.
STORY: The user arrives in the largest feature, can move between media destinations, search,
switch profile, and continue through the row beneath.
FIRST VIEWPORT: Sidebar at left, feature artwork filling the right, title copy over the lower
left, and one poster rail crossing the bottom.
FORM: TV app browse shell with persistent destination rail and a hero-led playback canvas.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d36">
  <title>TV Projects</title>
  <link rel="stylesheet" href="styles.css?v=real1">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <button class="profile" id="profileButton" aria-label="Switch profile">
      <span class="profile-avatar">R</span>
      <strong>Rody</strong>
      <time>9:41 AM</time>
    </button>

    <nav class="main-nav" aria-label="Main">
      <button class="nav-row" data-nav="Search"><span class="nav-icon">⌕</span><span>Search</span></button>
      <button class="nav-row" data-nav="Home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-row active" data-nav="TV"><span class="tv-mark">tv</span><span>Projects TV</span></button>
      <button class="nav-row" data-nav="Sports"><span class="nav-icon">⌁</span><span>Sports</span></button>
      <button class="nav-row" data-nav="Store"><span class="nav-icon">▣</span><span>Store</span></button>
      <button class="nav-row" data-nav="Library"><span class="nav-icon">▰</span><span>Library</span></button>
    </nav>

    <p class="side-label">Channels &amp; Apps</p>
    <nav class="channel-nav" aria-label="Channels">
      <button class="channel-row"><span class="channel-logo coral">HBO</span><span>HBO Max</span></button>
      <button class="channel-row"><span class="channel-logo peach">P</span><span>Peacock</span></button>
    </nav>
  </aside>

  <main class="stage" id="stage">
    <section class="hero" id="hero">
      <img id="heroImage" src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=2200&q=92" alt="">
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <p id="heroType">New series</p>
        <h1 id="heroTitle">The Archive</h1>
        <p id="heroMeta">TV-MA <span>Drama · Mystery</span></p>
        <div class="hero-controls">
          <button id="playButton" aria-label="Play">▶</button>
          <button id="nextButton" aria-label="Next feature">→</button>
        </div>
      </div>
      <div class="dots" id="heroDots" aria-label="Featured item"></div>
    </section>

    <section class="rail" aria-label="Continue watching">
      <div class="rail-track" id="railTrack"></div>
    </section>
  </main>

  <dialog id="searchDialog" class="dialog">
    <div class="dialog-head">
      <h2>Search</h2>
      <button class="close-button" data-close aria-label="Close">×</button>
    </div>
    <input id="searchInput" type="search" placeholder="Movies, shows, people" aria-label="Search">
    <div id="searchResults"></div>
  </dialog>

  <dialog id="profileDialog" class="dialog profile-dialog">
    <div class="dialog-head">
      <h2>Who's Watching?</h2>
      <button class="close-button" data-close aria-label="Close">×</button>
    </div>
    <div class="profiles">
      <button><span>R</span><strong>Rody</strong></button>
      <button><span>M</span><strong>Kids</strong></button>
      <button><span>+</span><strong>Add Profile</strong></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=real1"></script>
</body>
</html>
